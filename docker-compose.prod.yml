# Production stack for one server (VPS).
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Services:
#   db       PostgreSQL 17, never exposed to the internet
#   migrate  applies pending migrations, then exits (the app waits for it)
#   app      Turnos IA (also runs the background jobs: emails, reminders, cleanup)
#   caddy    HTTPS with automatic Let's Encrypt certificates, the only public service
#   backup   pg_dump every day, keeps BACKUP_KEEP_DAYS days
#
# Full guide: deploy/README.md
name: turnos-ia

x-app-env: &app-env
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://turnos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@db:5432/turnos
    # Caddy is the only proxy in front and sets X-Forwarded-For.
    CLIENT_IP_HEADER: x-forwarded-for
    TRUSTED_PROXY_HOPS: "1"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: turnos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    build: { context: ., target: tools }
    <<: *app-env
    command: ["pnpm", "db:migrate"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  app:
    build: { context: ., target: runner }
    <<: *app-env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: turnos
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      PGDATABASE: turnos
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
