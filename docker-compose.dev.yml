# Development services only (the app runs with `pnpm dev`).
#   docker compose -f docker-compose.dev.yml up -d
# Postgres → 127.0.0.1:5432   Mailpit UI → http://localhost:8025 (SMTP 1025)
name: turnos-ia-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: turnos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - turnos_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  turnos_dev_pg:
